# Copie para .github/workflows/android-touch-apk.yml no seu fork.
# Gera o APK (debug, assinado com a chave debug) a cada push na branch feat/touch-controls
# e publica como artefato do workflow (aba Actions > run > Artifacts).
# AJUSTE os dois passos marcados com >>> conforme os scripts reais do package.json
# (o workflow de release do projeto já gera APK: copie de lá o comando exato).
name: android-touch-apk
on:
  push: { branches: [feat/touch-controls] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # >>> 1) build do renderer web usado pelo Capacitor (ver package.json, ex.: "build:mobile")
      - run: npm run build:mobile --if-present
      # >>> 2) sync + gradle
      - working-directory: apps/mobile
        run: npx cap sync android
      - working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: relic-of-the-past-touch-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
