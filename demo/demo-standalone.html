<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Relic of the Past · Demo do controle na tela</title>
<style>/* @layer renderer @kind style — overlay de controle na tela */
.rotp-touch {
  --rotp-opacity: .5;
  position: fixed; inset: 0; z-index: 50;
  pointer-events: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.rotp-ctl {
  position: absolute; pointer-events: auto; touch-action: none;
  opacity: var(--rotp-opacity); transition: opacity .15s;
  box-sizing: border-box;
}
/* ---- D-pad ---- */
.rotp-dpad { border-radius: 50%; }
.rotp-dpad-cross { position: absolute; inset: 0; will-change: transform; }
.rotp-dpad-arm, .rotp-dpad-hub {
  position: absolute; background: rgba(20,20,24,.78);
  border: 1.5px solid rgba(255,255,255,.55);
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.rotp-up, .rotp-down { left: 33.5%; width: 33%; height: 36%; }
.rotp-left, .rotp-right { top: 33.5%; height: 33%; width: 36%; }
.rotp-up { top: 0; border-radius: 18% 18% 0 0; border-bottom: none; }
.rotp-down { bottom: 0; border-radius: 0 0 18% 18%; border-top: none; }
.rotp-left { left: 0; border-radius: 18% 0 0 18%; border-right: none; }
.rotp-right { right: 0; border-radius: 0 18% 18% 0; border-left: none; }
.rotp-dpad-hub { left: 33.5%; top: 33.5%; width: 33%; height: 33%; border: none; box-shadow: none; }
.rotp-dpad-arm::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 0; height: 0;
  border: 7px solid transparent; opacity: .7;
}
.rotp-up::after { border-bottom-color: #fff; border-top: 0; }
.rotp-down::after { border-top-color: #fff; border-bottom: 0; }
.rotp-left::after { border-right-color: #fff; border-left: 0; }
.rotp-right::after { border-left-color: #fff; border-right: 0; }
.rotp-dpad-arm.rotp-on { background: rgba(255,255,255,.55); }

/* ---- Losango A/B/X/Y (cores SFC) ---- */
.rotp-face { border-radius: 50%; }
.rotp-btn {
  position: absolute; width: 36%; height: 36%; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 700;
  font-size: clamp(14px, 4.2vmin, 26px); text-shadow: 0 1px 2px rgba(0,0,0,.6);
  border: 2px solid rgba(255,255,255,.6); box-shadow: 0 3px 8px rgba(0,0,0,.4);
  transition: transform .05s, filter .05s;
}
.rotp-btn-x { left: 32%; top: 0; background: #2a5bd7; }
.rotp-btn-a { right: 0; top: 32%; background: #d0302b; }
.rotp-btn-b { left: 32%; bottom: 0; background: #e6b51e; }
.rotp-btn-y { left: 0; top: 32%; background: #1f9a4a; }
.rotp-btn.rotp-on { transform: scale(.9); filter: brightness(1.6); box-shadow: 0 0 0 4px rgba(255,255,255,.7), 0 0 18px rgba(255,255,255,.5); }

/* ---- Ombros / Start / Select ---- */
.rotp-shoulder, .rotp-pill {
  display: grid; place-items: center; color: #fff; font-weight: 700;
  background: rgba(20,20,24,.78); border: 1.5px solid rgba(255,255,255,.55);
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.rotp-shoulder { font-size: clamp(13px, 3.6vmin, 22px); }
.rotp-shoulder-l { border-radius: 40% 14% 14% 14% / 60% 20% 20% 20%; }
.rotp-shoulder-r { border-radius: 14% 40% 14% 14% / 20% 60% 20% 20%; }
.rotp-pill { border-radius: 999px; font-size: clamp(9px, 2.2vmin, 13px); letter-spacing: .06em; }
.rotp-shoulder.rotp-on, .rotp-pill.rotp-on { background: rgba(255,255,255,.55); color: #111; }

/* ---- Modo edição ---- */
.rotp-editing .rotp-ctl { opacity: .9; outline: 2px dashed #4fc3f7; outline-offset: 4px; cursor: move; }
.rotp-editing::before {
  content: "Arraste os controles · toque em Concluir para salvar";
  position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.75); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px;
}
@media (prefers-reduced-motion: reduce) { .rotp-btn, .rotp-ctl { transition: none; } }
</style>

<body>
<div id="game"><div id="screen"><div id="state">aguardando…</div></div></div>
<div id="tools"><button id="edit">Editar layout</button><button id="mode">D-pad: fixo</button><button id="reset">Restaurar</button></div>
<script>
/**
 * Layout padrão inspirado no consenso da comunidade (RetroArch / Delta / Lemuroid):
 * D-pad à esquerda, losango SNES à direita, L/R nos cantos superiores,
 * Select/Start centralizados embaixo, longe da área de jogo central.
 */
const DEFAULT_LANDSCAPE = {
    dpad: { anchor: 'bl', x: 6, y: 6, size: 38 },
    face: { anchor: 'br', x: 5, y: 5, size: 40 },
    L: { anchor: 'tl', x: 4, y: 4, size: 20 },
    R: { anchor: 'tr', x: 4, y: 4, size: 20 },
    SELECT: { anchor: 'bc', x: -9, y: 3, size: 13 },
    START: { anchor: 'bc', x: 9, y: 3, size: 13 },
};
/** Retrato: controles na metade de baixo, jogo em cima (padrão Delta/Lemuroid). */
const DEFAULT_PORTRAIT = {
    dpad: { anchor: 'bl', x: 6, y: 22, size: 40 },
    face: { anchor: 'br', x: 5, y: 20, size: 44 },
    L: { anchor: 'bl', x: 4, y: 56, size: 22 },
    R: { anchor: 'br', x: 4, y: 56, size: 22 },
    SELECT: { anchor: 'bc', x: -11, y: 6, size: 15 },
    START: { anchor: 'bc', x: 11, y: 6, size: 15 },
};
const DEFAULT_SETTINGS = {
    enabled: true,
    opacity: 0.5,
    scale: 1,
    haptics: true,
    dpadMode: 'fixed',
    dpadDeadzone: 0.18,
    diagonalArc: 40,
    hideWithGamepad: true,
    buttonCombos: true,
    sink: 'gamepad',
};
const STORAGE_KEY = 'rotp.touchControls.v1';

// Índices do mapeamento "standard" (W3C). Posição física SNES -> posição standard.
const STD_INDEX = {
    B: 0, // sul
    A: 1, // leste
    Y: 2, // oeste
    X: 3, // norte
    L: 4, R: 5,
    SELECT: 8, START: 9,
    UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15,
};
class VirtualGamepadSink {
    static ID = 'Relic Touch Controller (STANDARD GAMEPAD Vendor: 0000 Product: 0000)';
    buttons = Array.from({ length: 17 }, () => ({ pressed: false, touched: false, value: 0 }));
    axes = [0, 0, 0, 0];
    index = 0;
    connected = false;
    timestamp = performance.now();
    original;
    snapshot() {
        return {
            id: VirtualGamepadSink.ID,
            index: this.index,
            connected: this.connected,
            mapping: 'standard',
            timestamp: this.timestamp,
            axes: this.axes.slice(),
            buttons: this.buttons.map(b => ({ ...b })),
            vibrationActuator: null,
            hapticActuators: [],
        };
    }
    connect() {
        if (this.connected)
            return;
        const nav = navigator;
        this.original = nav.__rotpOrigGetGamepads ?? navigator.getGamepads?.bind(navigator) ?? (() => []);
        nav.__rotpOrigGetGamepads = this.original;
        const real = Array.from(this.original());
        // primeiro slot livre: não colide com controles físicos
        this.index = real.findIndex(p => !p);
        if (this.index < 0)
            this.index = real.length;
        this.connected = true;
        const self = this;
        navigator.getGamepads = function () {
            const list = Array.from(self.original());
            while (list.length <= self.index)
                list.push(null);
            if (self.connected)
                list[self.index] = self.snapshot();
            return list;
        };
        this.fire('gamepadconnected');
    }
    disconnect() {
        if (!this.connected)
            return;
        this.buttons.forEach(b => { b.pressed = b.touched = false; b.value = 0; });
        this.connected = false;
        this.fire('gamepaddisconnected');
        if (this.original)
            navigator.getGamepads = this.original;
    }
    setButton(id, pressed) {
        const b = this.buttons[STD_INDEX[id]];
        if (b.pressed === pressed)
            return;
        b.pressed = b.touched = pressed;
        b.value = pressed ? 1 : 0;
        this.timestamp = performance.now();
    }
    fire(type) {
        const ev = new Event(type);
        Object.defineProperty(ev, 'gamepad', { value: this.snapshot() });
        window.dispatchEvent(ev);
    }
}
/** Mapeamento de teclado padrão do zelda3 (snesrev). Ajuste se o app tiver outro. */
const ZELDA3_DEFAULT_KEYS = {
    UP: { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
    DOWN: { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
    LEFT: { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
    RIGHT: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
    A: { key: 'x', code: 'KeyX', keyCode: 88 },
    B: { key: 'z', code: 'KeyZ', keyCode: 90 },
    X: { key: 's', code: 'KeyS', keyCode: 83 },
    Y: { key: 'a', code: 'KeyA', keyCode: 65 },
    L: { key: 'c', code: 'KeyC', keyCode: 67 },
    R: { key: 'v', code: 'KeyV', keyCode: 86 },
    SELECT: { key: 'Shift', code: 'ShiftRight', keyCode: 16 },
    START: { key: 'Enter', code: 'Enter', keyCode: 13 },
};
class KeyboardSink {
    target;
    keys;
    down = new Set();
    constructor(target = window, keys = ZELDA3_DEFAULT_KEYS) {
        this.target = target;
        this.keys = keys;
    }
    connect() { }
    disconnect() { [...this.down].forEach(id => this.setButton(id, false)); }
    setButton(id, pressed) {
        if (pressed === this.down.has(id))
            return;
        pressed ? this.down.add(id) : this.down.delete(id);
        const k = this.keys[id];
        const ev = new KeyboardEvent(pressed ? 'keydown' : 'keyup', { key: k.key, code: k.code, bubbles: true, cancelable: true });
        // Emscripten antigo ainda lê keyCode/which
        Object.defineProperty(ev, 'keyCode', { get: () => k.keyCode });
        Object.defineProperty(ev, 'which', { get: () => k.keyCode });
        this.target.dispatchEvent(ev);
    }
}

function tick(strong = false) {
    const h = window.Capacitor?.Plugins?.Haptics;
    if (h) {
        h.impact({ style: strong ? 'MEDIUM' : 'LIGHT' }).catch(() => { });
        return;
    }
    try {
        navigator.vibrate?.(strong ? 14 : 8);
    }
    catch { /* sem suporte */ }
}




const FACE_LABELS = {
    X: [0, -1], A: [1, 0], B: [0, 1], Y: [-1, 0],
};
class TouchControls {
    host;
    root;
    els = {};
    btnEls = new Map();
    hits = new Map();
    tracks = new Map();
    refCount = new Map();
    sink;
    customSink;
    data;
    editing = false;
    hiddenByPad = false;
    ro;
    listeners = [];
    constructor(host, opts = {}) {
        this.host = host;
        this.data = this.load();
        if (opts.settings)
            Object.assign(this.data.settings, opts.settings);
        this.customSink = opts.sink;
        this.root = document.createElement('div');
        this.root.className = 'rotp-touch';
        this.root.setAttribute('aria-hidden', 'true');
        this.build();
        host.appendChild(this.root);
        this.useSink();
        this.bind();
        this.apply();
    }
    // ---------- API pública ----------
    get settings() { return { ...this.data.settings }; }
    update(patch) {
        const sinkChanged = patch.sink && patch.sink !== this.data.settings.sink;
        Object.assign(this.data.settings, patch);
        if (sinkChanged) {
            this.releaseAll();
            this.sink.disconnect();
            this.useSink();
        }
        if (patch.enabled === false) {
            this.releaseAll();
            this.sink.disconnect();
        }
        if (patch.enabled === true)
            this.sink.connect();
        this.save();
        this.apply();
    }
    setEditing(on) {
        this.editing = on;
        this.releaseAll();
        this.root.classList.toggle('rotp-editing', on);
        if (!on)
            this.save();
    }
    resetLayout() {
        this.data.landscape = structuredClone(DEFAULT_LANDSCAPE);
        this.data.portrait = structuredClone(DEFAULT_PORTRAIT);
        this.save();
        this.apply();
    }
    destroy() {
        this.releaseAll();
        this.sink.disconnect();
        this.listeners.forEach(off => off());
        this.ro?.disconnect();
        this.root.remove();
    }
    // ---------- construção ----------
    build() {
        const mk = (cls, parent = this.root, text = '') => {
            const d = document.createElement('div');
            d.className = cls;
            if (text)
                d.textContent = text;
            parent.appendChild(d);
            return d;
        };
        const dpad = mk('rotp-ctl rotp-dpad');
        const cross = mk('rotp-dpad-cross', dpad);
        ['UP', 'DOWN', 'LEFT', 'RIGHT'].forEach(d => this.btnEls.set(d, mk(`rotp-dpad-arm rotp-${d.toLowerCase()}`, cross)));
        mk('rotp-dpad-hub', cross);
        this.els.dpad = dpad;
        const face = mk('rotp-ctl rotp-face');
        Object.keys(FACE_LABELS).forEach(id => {
            this.btnEls.set(id, mk(`rotp-btn rotp-btn-${id.toLowerCase()}`, face, id));
        });
        this.els.face = face;
        ['L', 'R'].forEach(id => {
            const el = mk(`rotp-ctl rotp-shoulder rotp-shoulder-${id.toLowerCase()}`, this.root, id);
            this.els[id] = el;
            this.btnEls.set(id, el);
        });
        ['SELECT', 'START'].forEach(id => {
            const el = mk('rotp-ctl rotp-pill', this.root, id === 'START' ? 'START' : 'SELECT');
            this.els[id] = el;
            this.btnEls.set(id, el);
        });
    }
    useSink() {
        this.sink = this.customSink ?? (this.data.settings.sink === 'keyboard' ? new KeyboardSink() : new VirtualGamepadSink());
        if (this.data.settings.enabled)
            this.sink.connect();
    }
    bind() {
        const on = (t, ev, fn, o) => {
            t.addEventListener(ev, fn, o);
            this.listeners.push(() => t.removeEventListener(ev, fn, o));
        };
        const opts = { passive: false };
        Object.keys(this.els).forEach(g => {
            on(this.els[g], 'pointerdown', e => this.down(e, g), opts);
            on(this.els[g], 'pointermove', e => this.move(e), opts);
            on(this.els[g], 'pointerup', e => this.up(e), opts);
            on(this.els[g], 'pointercancel', e => this.up(e), opts);
            on(this.els[g], 'lostpointercapture', e => this.up(e), opts);
        });
        on(this.root, 'contextmenu', e => e.preventDefault(), opts);
        on(window, 'resize', () => this.apply());
        on(window, 'orientationchange', () => this.apply());
        on(window, 'blur', () => this.releaseAll());
        on(document, 'visibilitychange', () => { if (document.hidden)
            this.releaseAll(); });
        // controle físico: esconde; toque na tela: volta
        on(window, 'gamepadconnected', (e) => {
            const gp = e.gamepad;
            if (gp && gp.id !== VirtualGamepadSink.ID && this.data.settings.hideWithGamepad) {
                this.hiddenByPad = true;
                this.releaseAll();
                this.apply();
            }
        });
        on(window, 'touchstart', () => { if (this.hiddenByPad) {
            this.hiddenByPad = false;
            this.apply();
        } }, { passive: true });
        this.ro = new ResizeObserver(() => this.measure());
        this.ro.observe(this.host);
    }
    // ---------- layout ----------
    get portrait() { return window.innerHeight > window.innerWidth; }
    get layout() { return this.portrait ? this.data.portrait : this.data.landscape; }
    get unit() { return Math.min(window.innerWidth, window.innerHeight) / 100; }
    apply() {
        const s = this.data.settings;
        const visible = s.enabled && !this.hiddenByPad;
        this.root.style.display = visible ? '' : 'none';
        this.root.style.setProperty('--rotp-opacity', String(s.opacity));
        this.root.classList.toggle('rotp-portrait', this.portrait);
        const u = this.unit;
        Object.keys(this.els).forEach(g => this.place(this.els[g], this.layout[g], u * s.scale, u));
        requestAnimationFrame(() => this.measure());
    }
    place(el, p, su, u) {
        const size = p.size * su;
        el.style.width = el.style.height = `${size}px`;
        if (el.classList.contains('rotp-pill'))
            el.style.height = `${size * 0.42}px`;
        if (el.classList.contains('rotp-shoulder'))
            el.style.height = `${size * 0.48}px`;
        el.style.left = el.style.right = el.style.top = el.style.bottom = el.style.transform = '';
        const x = `${p.x * u}px`, y = `${p.y * u}px`;
        const sl = 'env(safe-area-inset-left, 0px)', sr = 'env(safe-area-inset-right, 0px)', sb = 'env(safe-area-inset-bottom, 0px)', st = 'env(safe-area-inset-top, 0px)';
        switch (p.anchor) {
            case 'bl':
                el.style.left = `calc(${x} + ${sl})`;
                el.style.bottom = `calc(${y} + ${sb})`;
                break;
            case 'br':
                el.style.right = `calc(${x} + ${sr})`;
                el.style.bottom = `calc(${y} + ${sb})`;
                break;
            case 'tl':
                el.style.left = `calc(${x} + ${sl})`;
                el.style.top = `calc(${y} + ${st})`;
                break;
            case 'tr':
                el.style.right = `calc(${x} + ${sr})`;
                el.style.top = `calc(${y} + ${st})`;
                break;
            case 'bc':
                el.style.left = `calc(50% + ${x})`;
                el.style.bottom = `calc(${y} + ${sb})`;
                el.style.transform = 'translateX(-50%)';
                break;
        }
    }
    /** Cache de círculos de acerto (evita getBoundingClientRect a cada pointermove). */
    measure() {
        this.hits.clear();
        const slop = 1.3; // hit-slop: área de toque 30% maior que o desenho
        const circ = (id, el, k = slop) => {
            const r = el.getBoundingClientRect();
            return { id, cx: r.left + r.width / 2, cy: r.top + r.height / 2, r: Math.max(r.width, r.height) / 2 * k };
        };
        this.hits.set('face', ['A', 'B', 'X', 'Y'].map(id => circ(id, this.btnEls.get(id))));
        ['L', 'R', 'START', 'SELECT'].forEach(id => this.hits.set(id, [circ(id, this.els[id], 1.15)]));
    }
    // ---------- entrada ----------
    down(e, g) {
        e.preventDefault();
        e.stopPropagation();
        const el = e.currentTarget;
        try {
            el.setPointerCapture(e.pointerId);
        }
        catch { /* ok */ }
        const t = { group: g, held: new Set(), startX: e.clientX, startY: e.clientY };
        if (this.editing) {
            const r = el.getBoundingClientRect();
            t.ox = r.left;
            t.oy = r.top;
            this.tracks.set(e.pointerId, t);
            return;
        }
        this.tracks.set(e.pointerId, t);
        if (g === 'dpad' && this.data.settings.dpadMode === 'floating') {
            // centro nasce onde o polegar encostou
            t.ox = e.clientX;
            t.oy = e.clientY;
            const r = this.els.dpad.getBoundingClientRect();
            this.cross().style.transform = `translate(${e.clientX - (r.left + r.width / 2)}px, ${e.clientY - (r.top + r.height / 2)}px)`;
        }
        this.resolve(e, t, true);
    }
    move(e) {
        const t = this.tracks.get(e.pointerId);
        if (!t)
            return;
        e.preventDefault();
        if (this.editing) {
            this.drag(e, t);
            return;
        }
        for (const ev of (e.getCoalescedEvents?.() ?? [e]).slice(-1))
            this.resolve(ev, t, false);
    }
    up(e) {
        const t = this.tracks.get(e.pointerId);
        if (!t)
            return;
        this.tracks.delete(e.pointerId);
        if (this.editing) {
            this.commitDrag(t);
            return;
        }
        t.held.forEach(id => this.release(id));
        t.held.clear();
        if (t.group === 'dpad')
            this.cross().style.transform = '';
    }
    cross() { return this.els.dpad.firstElementChild; }
    resolve(e, t, first) {
        const next = t.group === 'dpad' ? this.dpadDirs(e, t) : this.buttonsAt(e.clientX, e.clientY, t.group);
        // slide: se saiu de todos os botões do grupo após o primeiro toque, mantém o último (evita "cair" do botão)
        if (!first && next.size === 0 && t.group !== 'dpad' && t.group !== 'face')
            return;
        t.held.forEach(id => { if (!next.has(id)) {
            this.release(id);
            t.held.delete(id);
        } });
        let pressedNew = false;
        next.forEach(id => { if (!t.held.has(id)) {
            this.press(id);
            t.held.add(id);
            pressedNew = true;
        } });
        if (pressedNew && this.data.settings.haptics)
            tick(t.group === 'START' || t.group === 'SELECT');
    }
    dpadDirs(e, t) {
        const r = this.els.dpad.getBoundingClientRect();
        const cx = t.ox ?? r.left + r.width / 2, cy = t.oy ?? r.top + r.height / 2;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const radius = r.width / 2;
        const out = new Set();
        if (Math.hypot(dx, dy) < radius * this.data.settings.dpadDeadzone)
            return out;
        // ângulo 0° = direita, sentido horário (y da tela cresce para baixo)
        const ang = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        const half = this.data.settings.diagonalArc / 2;
        const near = (c) => { const d = Math.abs(((ang - c + 540) % 360) - 180); return d; };
        const card = [[0, 'RIGHT'], [90, 'DOWN'], [180, 'LEFT'], [270, 'UP']];
        const diag = [[45, 'RIGHT', 'DOWN'], [135, 'DOWN', 'LEFT'], [225, 'LEFT', 'UP'], [315, 'UP', 'RIGHT']];
        const d = diag.find(([c]) => near(c) <= half);
        if (d) {
            out.add(d[1]);
            out.add(d[2]);
        }
        else
            out.add(card.reduce((a, b) => (near(a[0]) < near(b[0]) ? a : b))[1]);
        return out;
    }
    buttonsAt(x, y, g) {
        const hits = this.hits.get(g) ?? [];
        const inside = hits.map(h => ({ h, d: Math.hypot(x - h.cx, y - h.cy) / h.r })).filter(o => o.d <= 1).sort((a, b) => a.d - b.d);
        const out = new Set();
        if (!inside.length)
            return out;
        out.add(inside[0].h.id);
        // combo: dedo na fronteira entre dois botões vizinhos (ex.: B+Y, B+A)
        if (g === 'face' && this.data.settings.buttonCombos && inside[1] && inside[1].d - inside[0].d < 0.12)
            out.add(inside[1].h.id);
        return out;
    }
    press(id) {
        const n = (this.refCount.get(id) ?? 0) + 1;
        this.refCount.set(id, n);
        if (n === 1) {
            this.sink.setButton(id, true);
            this.btnEls.get(id)?.classList.add('rotp-on');
        }
    }
    release(id) {
        const n = Math.max(0, (this.refCount.get(id) ?? 0) - 1);
        this.refCount.set(id, n);
        if (n === 0) {
            this.sink.setButton(id, false);
            this.btnEls.get(id)?.classList.remove('rotp-on');
        }
    }
    releaseAll() {
        this.tracks.forEach(t => t.held.forEach(id => this.release(id)));
        this.tracks.clear();
        this.refCount.forEach((_, id) => { this.refCount.set(id, 0); this.sink?.setButton(id, false); this.btnEls.get(id)?.classList.remove('rotp-on'); });
    }
    // ---------- modo edição ----------
    drag(e, t) {
        const el = this.els[t.group];
        el.style.left = `${t.ox + e.clientX - t.startX}px`;
        el.style.top = `${t.oy + e.clientY - t.startY}px`;
        el.style.right = el.style.bottom = el.style.transform = '';
    }
    commitDrag(t) {
        const el = this.els[t.group];
        const r = el.getBoundingClientRect(), u = this.unit, W = window.innerWidth, H = window.innerHeight;
        const p = this.layout[t.group];
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        // reancora no canto mais próximo para sobreviver a mudança de resolução
        const left = cx < W / 2, top = cy < H / 2;
        if (p.anchor === 'bc') {
            p.x = (cx - W / 2) / u;
            p.y = (H - r.bottom) / u;
        }
        else {
            p.anchor = `${top ? 't' : 'b'}${left ? 'l' : 'r'}`;
            p.x = (left ? r.left : W - r.right) / u;
            p.y = (top ? r.top : H - r.bottom) / u;
        }
        this.save();
        this.apply();
    }
    // ---------- persistência ----------
    load() {
        const base = { settings: { ...DEFAULT_SETTINGS }, landscape: structuredClone(DEFAULT_LANDSCAPE), portrait: structuredClone(DEFAULT_PORTRAIT) };
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw)
                return base;
            const p = JSON.parse(raw);
            return {
                settings: { ...base.settings, ...p.settings },
                landscape: { ...base.landscape, ...p.landscape },
                portrait: { ...base.portrait, ...p.portrait },
            };
        }
        catch {
            return base;
        }
    }
    save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        }
        catch { /* quota */ }
    }
}


const tc = new TouchControls(document.getElementById('game'));
window.__tc = tc;
const names = ['B','A','Y','X','L','R','','','SELECT','START','','','UP','DOWN','LEFT','RIGHT'];
// simula o loop do SDL/Emscripten lendo a Gamepad API
(function poll(){
  const pads = navigator.getGamepads().filter(Boolean);
  const out = pads.map(p => `${p.id.split(' (')[0]}  [${p.mapping}]\n` + (p.buttons.map((b,i)=>b.pressed?names[i]:null).filter(Boolean).join(' + ') || '—'));
  document.getElementById('state').textContent = out.join('\n') || 'sem gamepad';
  window.__pressed = pads[0] ? pads[0].buttons.map((b,i)=>b.pressed?names[i]:null).filter(Boolean) : [];
  requestAnimationFrame(poll);
})();
let editing=false; edit.onclick=()=>{editing=!editing;tc.setEditing(editing);edit.textContent=editing?'Concluir':'Editar layout'};
mode.onclick=()=>{const f=tc.settings.dpadMode==='fixed'?'floating':'fixed';tc.update({dpadMode:f});mode.textContent='D-pad: '+(f==='fixed'?'fixo':'flutuante')};
reset.onclick=()=>tc.resetLayout();
</script>
